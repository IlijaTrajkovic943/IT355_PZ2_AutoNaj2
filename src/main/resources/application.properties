spring.application.name=autonaj2

# H2 In-Memory baza podataka (umesto MySQL-a)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate automatski kreira/azurira tabele na osnovu @Entity klasa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT podesavanja
jwt.secret=autonaj-tajni-kljuc-za-potpisivanje-jwt-tokena-mora-biti-dovoljno-dugacak-2026
jwt.trajanje-ms=86400000